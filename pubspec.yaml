name: bip32
description: >-
  A [BIP32](https://github.com/bitcoin/bips/blob/master/bip-0032.mediawiki)
  hierarchical deterministic wallet library for Dart and Flutter.
version: 4.0.2
homepage: https://github.com/bulltechnologies/bip32
repository: https://github.com/bulltechnologies/bip32
issue_tracker: https://github.com/bulltechnologies/bip32/issues
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  native_crypto:
    git:
      url: https://github.com/bulltechnologies/native_crypto.git
      ref: 4de5f63783c95613eacf2e4c666a1c69db86ead9
  native_sig:
    git:
      url: https://github.com/bulltechnologies/native_sig.git
      ref: 1c85d70cd32c57c05fc7a7d7236b8cd57a3c2f4f

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hex: ^0.2.0
  path: ^1.9.0
