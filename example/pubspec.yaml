name: bip32_example
description: Example and native test harness for the bip32 package.
publish_to: 'none'

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  bip32:
    path: ../
  native_crypto:
    git:
      url: https://github.com/bulltechnologies/native_crypto.git
      ref: f1fa243105556b594add832ff6a74bdcf1076a86
  native_sig:
    git:
      url: https://github.com/bulltechnologies/native_sig.git
      ref: 557f4ced22c9b9cc73652c380ae42f6b682db333

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hex: ^0.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures.json
    - assets/v3_compat_golden.json
